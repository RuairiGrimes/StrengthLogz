name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Android Unit Tests
        working-directory: ./mobile-android
        run: gradle testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        working-directory: ./mobile-android
        run: gradle assembleDebug --no-daemon

      - name: Copy APK to deliverable name
        run: cp mobile-android/app/build/outputs/apk/debug/app-debug.apk StrengthLogz-Native.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrengthLogz-Native-APK
          path: StrengthLogz-Native.apk
          retention-days: 90
